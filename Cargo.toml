[package]
name = "ravel"
version = "0.3.0"
edition = "2021"
description = "Transcript-graph engine: a transcript becomes a graph of meaning. git-lex / Pool sibling."
license = "Apache-2.0"
repository = "https://github.com/repolex-ai/ravel"

[lib]
name = "ravel"
path = "src/lib.rs"

# raveld — the daemon. One per machine; the only process that writes a soul's
# transcript store. Mirrors and ingests every registered soul on its own
# schedule. There are no hooks (goodlux, 2026-09-22).
[[bin]]
name = "raveld"
path = "src/bin/raveld.rs"

# ravel — the command line. A thin client of raveld; starts it when it is not
# running. Never opens a store itself.
[[bin]]
name = "ravel"
path = "src/bin/ravel.rs"

[dependencies]
# Same store as Pool — rdf-12 for triple terms (squad standard, not RDF-star).
oxigraph = { version = "0.5.6", features = ["rdf-12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
# Deterministic annotation IRIs (idempotent reimport — the w4r3z discipline).
sha2 = "0.10"
# The daemon's HTTP surface and its clock; the same crates pan uses.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde_yaml = "0.9"

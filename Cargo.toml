[package]
name = "weave"
version = "0.1.0"
edition = "2021"
description = "Transcript-graph engine: a transcript becomes a graph of meaning. git-lex / Pool sibling."
license = "Apache-2.0"
repository = "https://github.com/repolex-ai/weave"

[lib]
name = "weave"
path = "src/lib.rs"

[[bin]]
name = "weave-spike"
path = "src/bin/spike.rs"

# Promote a proven reader through the engine: emojikey → real triple-term
# annotations (replaces the spike's fake STRLEN>2000 detector with a real reader).
[[bin]]
name = "weave-emojikey"
path = "src/bin/emojikey.rs"

# Ingest many sessions into ONE persistent on-disk graph + query across them.
[[bin]]
name = "weave-ingest"
path = "src/bin/ingest.rs"

[[bin]]
name = "weave-stats"
path = "src/bin/stats.rs"

[dependencies]
# Same store as Pool — rdf-12 for triple terms (squad standard, not RDF-star).
oxigraph = { version = "0.5.6", features = ["rdf-12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
# Deterministic annotation IRIs (idempotent reimport — the w4r3z discipline).
sha2 = "0.10"
